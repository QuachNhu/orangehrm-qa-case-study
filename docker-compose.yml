# Local OrangeHRM instance used as the system under test (http://localhost:8080)
services:
  orangehrm:
    image: orangehrm/orangehrm:latest
    container_name: orangehrm_web
    ports:
      - "8080:80"
    environment:
      - ORANGEHRM_DATABASE_HOST=db
      - ORANGEHRM_DATABASE_USER=orangehrm
      - ORANGEHRM_DATABASE_PASSWORD=orangehrm
      - ORANGEHRM_DATABASE_NAME=orangehrm
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: orangehrm_db
    ports:
      - "3306:3306"   # used by data-generation/ to insert test data
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=orangehrm
      - MYSQL_PASSWORD=orangehrm
      - MYSQL_DATABASE=orangehrm
    volumes:
      - orangehrm_db_data:/var/lib/mysql

volumes:
  orangehrm_db_data:
